                    const res = await apiCall('createLevel', newL);
                    
                    if(res.success) {
                        setLevels([...safeLevels, newL].sort((a,b) => a.id - b.id));
                        setCurrentPage(1);
                        closeModal();
                        GameAlert.success(t.alertSuccess, "บันทึกข้อมูลเรียบร้อย", t.btnConfirm);
                    } else {
                        GameAlert.error(t.alertError, res.message, t.btnConfirm);
                    }

                } else if (modalState.mode === 'edit') {
                    Swal.fire({ title: t.loading, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    const res = await apiCall('editLevel', newL);
                    
                    if(res.success) {
                        setLevels(safeLevels.map(l => String(l.id) === String(modalState.item.id) ? newL : l).sort((a,b) => a.id - b.id));
                        closeModal();
                        GameAlert.success(t.alertSuccess, "แก้ไขข้อมูลเรียบร้อย", t.btnConfirm);
                    } else {
                        GameAlert.error(t.alertError, res.message, t.btnConfirm);
                    }
                }

            const handleDelete = async (id) => {
                const res = await GameAlert.confirm(t.alertConfirm, t.confirmDelLevel, t.btnConfirm, t.btnCancel);
                if(res.isConfirmed) {
                    Swal.fire({ title: t.loading, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    const apiRes = await apiCall('deleteLevel', { id: id });
                    
                    if(apiRes.success) {
                        setLevels(safeLevels.filter(item => String(item.id) !== String(id)));
                        Swal.fire('ลบแล้ว!', 'ข้อมูลถูกลบเรียบร้อย', 'success');
                    } else {
                        GameAlert.error(t.alertError, apiRes.message, t.btnConfirm);
                    }
                }
            };

            const filteredLevels = safeLevels.filter(l => 
                String(l.nameTH || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
                String(l.nameEN || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(l.id || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentItems = filteredLevels.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(filteredLevels.length / itemsPerPage);
            const isReadOnly = modalState.mode === 'view';

            return (
                <>
                    <div className="space-y-6 animate-pop-in max-w-6xl mx-auto">
                         <div className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm border-2 border-gray-200 gap-4">
                            <h1 className="text-3xl font-black text-panel flex items-center gap-3"><span>🌟</span> {t.levelManageTitle}</h1>
                            <div className="flex flex-wrap justify-end gap-2 w-full md:w-auto items-center">
                                <input 
                                    type="text" 
                                    placeholder={t.searchPlaceholder} 
                                    className="game-input text-sm !py-2 w-full md:w-48" 
                                    value={searchTerm}
                                    onChange={(e) => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                                />
                                <button onClick={onRefresh} className="game-button bg-gradient-to-b from-gray-100 to-gray-200 !border-gray-300 !text-gray-700 !shadow-[0_4px_0_#D1D5DB] px-4 py-2 text-sm active:!shadow-[0_0px_0_#D1D5DB] flex items-center gap-2">🔄 {t.refresh}</button>
                                <button onClick={() => openModal('create')} className="game-button px-4 py-2 text-sm flex items-center gap-2">➕ {t.createLevelBtn}</button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-md border-2 border-gray-200 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left min-w-[800px]">
                                    <thead className="bg-panel text-white text-sm whitespace-nowrap">
                                        <tr>
                                            <th className="p-4 text-center w-20">Level</th>
                                            <th className="p-4">{t.colLevelNameTH}</th>
                                            <th className="p-4">{t.colLevelNameEN}</th>
                                            <th className="p-4 text-center">{t.colBadge}</th>
                                            <th className="p-4 text-center">{t.colActions}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {currentItems.map((l) => (
                                            <tr key={l.id} className="border-b border-gray-100 hover:bg-yellow-50 font-medium text-sm">
                                                <td className="p-4 text-center text-dark font-black text-lg">{l.id}</td>
                                                <td className="p-4 text-dark font-bold">{t.levelNameTHLabel}: {l.nameTH}</td>
                                                <td className="p-4 text-gray-500 font-bold">{t.levelNameENLabel}: {l.nameEN}</td>
                                                <td className="p-4 text-center">
                                                    <div className="w-12 h-12 mx-auto bg-gray-50 rounded-xl border-2 border-gray-200 flex items-center justify-center text-2xl overflow-hidden shadow-inner">
                                                        <ImageWithFallback src={l.badge} fallbackEmoji="🛡️" className="w-full h-full object-cover" alt="badge" />
                                                    </div>
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap justify-center gap-2">
                                                        <button onClick={() => openModal('view', l)} className="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg shadow-sm text-xs font-bold transition flex items-center gap-1" title={t.btnView}>👁️ {t.btnView}</button>
                                                        <button onClick={() => openModal('edit', l)} className="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1.5 rounded-lg shadow-sm text-xs font-bold transition flex items-center gap-1" title={t.btnEdit}>✏️ {t.btnEdit}</button>
                                                        <button onClick={() => handleDelete(l.id)} className="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg shadow-sm text-xs font-bold transition flex items-center gap-1" title={t.btnDelete}>🗑️ {t.btnDelete}</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                        {currentItems.length === 0 && (
                                            <tr><td colSpan="5" className="p-8 text-center text-gray-400 font-bold">{t.noLevelFound}</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            
                            {totalPages > 1 && (
                                <div className="p-4 bg-gray-50 border-t border-gray-200 flex justify-between items-center">
                                    <span className="text-sm font-bold text-gray-500">{t.page} {currentPage} {t.from} {totalPages} ({filteredLevels.length} {t.items})</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="px-4 py-2 rounded-lg font-bold text-sm bg-white border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">{t.prevPage}</button>
                                        <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="px-4 py-2 rounded-lg font-bold text-sm bg-white border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">{t.nextPage}</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {modalState.isOpen && (
                        <ModalPortal>
                            <div className="fixed inset-0 z-[9999] overflow-y-auto bg-gray-900/60 backdrop-blur-sm">
                                <div className="flex min-h-screen items-center justify-center p-4 text-center sm:p-6">
                                    <div className="relative w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 animate-pop-in border-4 border-gold shadow-2xl text-left transition-all my-8 mx-auto">
                                        <h2 className="text-2xl font-black text-panel mb-6 border-b-2 border-gray-100 pb-4 flex items-center gap-2">
                                            <span>{modalState.mode === 'create' ? '➕' : modalState.mode === 'edit' ? '✏️' : '👁️'}</span>
                                            {modalState.mode === 'create' ? t.modalCreateLevel : modalState.mode === 'edit' ? t.modalEditLevel : t.modalViewLevel}
                                        </h2>
                                        <form onSubmit={handleSubmit} className="space-y-4">
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1 text-sm">{t.levelNumLabel}</label>
                                                <input type="number" required min="1" className="game-input text-lg" placeholder="e.g. 6" 
                                                    value={formData.id} onChange={e => setFormData({...formData, id: e.target.value})} disabled={isReadOnly || modalState.mode === 'edit'} />
                                            </div>
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1 text-sm">{t.levelNameTHLabel}</label>
                                                <input type="text" required className="game-input" placeholder="e.g. นักรบแห่งแสง"
                                                    value={formData.nameTH} onChange={e => setFormData({...formData, nameTH: e.target.value})} disabled={isReadOnly} />
                                            </div>
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1 text-sm">{t.levelNameENLabel}</label>
                                                <input type="text" required className="game-input" placeholder="e.g. Light Warrior"
                                                    value={formData.nameEN} onChange={e => setFormData({...formData, nameEN: e.target.value})} disabled={isReadOnly} />
                                            </div>
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1 text-sm">{t.badgeUrlLabel}</label>
                                                <input type="text" placeholder={t.badgeUrlPlaceholder} className="game-input" 
                                                    value={formData.badgeUrl} onChange={e => setFormData({...formData, badgeUrl: e.target.value})} disabled={isReadOnly} />
                                            </div>
                                            <div className="flex gap-4 mt-8 pt-4">
                                                {isReadOnly ? (
                                                    <button type="button" onClick={closeModal} className="w-full py-4 game-button game-button-blue text-lg">{t.btnCloseWindow}</button>
                                                ) : (
                                                    <>
                                                        <button type="button" onClick={closeModal} className="flex-1 py-4 game-button game-button-red text-lg shadow-[0_6px_0_#991B1B]">{t.btnCancel}</button>
                                                        <button type="submit" className="flex-1 py-4 game-button game-button-green text-lg shadow-[0_6px_0_#166534]">💾 {t.btnSave}</button>
                                                    </>
                                                )}
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}
                </>
            );
        }

        const AdminNPCs = ({ npcs, setNpcs, t, onRefresh }) => {
            const [modalState, setModalState] = useState({ isOpen: false, mode: 'create', item: null });
            const [searchTerm, setSearchTerm] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 10;
            const fileInputRef = useRef(null);

            const safeNPCs = Array.isArray(npcs) ? npcs : [];

            const [formData, setFormData] = useState({
                username: '', password: '', empId: '', name: '', nickname: '', role: 'Staff'
            });

            const openModal = (mode, item = null) => {
                if(item && mode !== 'create') {
                    setFormData({ username: item.username, password: item.password, empId: item.id, name: item.name, nickname: item.nickname, role: item.role });
                } else {
                    setFormData({ username: '', password: '', empId: '', name: '', nickname: '', role: 'Staff' });
                }
                setModalState({ isOpen: true, mode, item });
            };

            const closeModal = () => setModalState({ isOpen: false, mode: 'create', item: null });
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                if(modalState.mode === 'view') {
                    closeModal(); return;
                }

                const newN = {
                    id: formData.empId, username: formData.username, password: formData.password, name: formData.name, nickname: formData.nickname, role: formData.role, status: 'Active'
                };
                
                if (modalState.mode === 'create') {
                    if(safeNPCs.some(n => String(n.id) === String(formData.empId))) {
                        GameAlert.error(t.alertError, t.errDupNpc, t.btnConfirm);
                        return;
                    }

                    Swal.fire({ title: t.loading, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    const res = await apiCall('createNPC', newN);

                    if(res.success) {
                        setNpcs([newN, ...safeNPCs]);
                        setCurrentPage(1);
                        closeModal();
                        GameAlert.success(t.alertSuccess, "บันทึกข้อมูลเรียบร้อย", t.btnConfirm);
                    } else {
                        GameAlert.error(t.alertError, res.message, t.btnConfirm);
                    }
                    
                } else if (modalState.mode === 'edit') {
                    Swal.fire({ title: t.loading, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    const res = await apiCall('editNPC', newN);
                    
                    if(res.success) {
                        setNpcs(safeNPCs.map(n => String(n.id) === String(modalState.item.id) ? newN : n));
                        closeModal();
                        GameAlert.success(t.alertSuccess, "แก้ไขข้อมูลเรียบร้อย", t.btnConfirm);
                    } else {
                        GameAlert.error(t.alertError, res.message, t.btnConfirm);
                    }
                }
            };

            const handleDelete = async (id) => {
                const res = await GameAlert.confirm(t.alertConfirm, t.confirmDelNpc, t.btnConfirm, t.btnCancel);
                if(res.isConfirmed) {
                    Swal.fire({ title: t.loading, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                    const apiRes = await apiCall('deleteNPC', { id: id });
                    
                    if(apiRes.success) {
                        setNpcs(safeNPCs.filter(item => String(item.id) !== String(id)));
                        Swal.fire('ลบแล้ว!', 'ข้อมูลถูกลบเรียบร้อย', 'success');
                    } else {
                        GameAlert.error(t.alertError, apiRes.message, t.btnConfirm);
                    }
                }
            };

            const handleExport = () => {
                const headers = ["Username", "Password", "รหัสพนักงาน", "ชื่อ-สกุล", "ชื่อเล่น", "สิทธิ์"];
                const csvRows = [headers.join(',')];
                
                safeNPCs.forEach(n => {
                    csvRows.push(`${n.username || ''},${n.password || ''},${n.id || ''},${n.name || ''},${n.nickname || ''},${n.role || ''}`);
                });
                
                const csvString = "\uFEFF" + csvRows.join('\n');
                const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', 'npc_list.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportClick = () => fileInputRef.current.click();

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split('\n');
                    const newNpcs = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const cols = lines[i].split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                        
                        if (cols.length >= 6) {
                            if(!safeNPCs.some(existing => String(existing.id) === String(cols[2])) && !newNpcs.some(n => String(n.id) === String(cols[2]))) {
                                newNpcs.push({
                                    username: cols[0], password: cols[1], id: cols[2], name: cols[3], nickname: cols[4], role: cols[5], status: 'Active'
                                });
                            }
                        }
                    }
                    
                    if (newNpcs.length > 0) {
                        setNpcs([...safeNPCs, ...newNpcs]);
                        GameAlert.success(t.alertSuccess, `${t.importSuccess} ${newNpcs.length} ${t.importSkip}`, t.btnConfirm);
                    } else {
                        GameAlert.error(t.alertError, t.importFail, t.btnConfirm);
                    }
                    e.target.value = null;
                };
                reader.readAsText(file, 'utf-8');
            };

            const filteredNPCs = safeNPCs.filter(n => 
                String(n.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
                String(n.nickname || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(n.id || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(n.role || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                String(n.username || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentItems = filteredNPCs.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(filteredNPCs.length / itemsPerPage);
            const isReadOnly = modalState.mode === 'view';

            return (
                <>
                    <div className="space-y-6 animate-pop-in max-w-6xl mx-auto">
                        <div className="flex flex-col md:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm border-2 border-gray-200 gap-4">
                            <h1 className="text-3xl font-black text-panel flex items-center gap-3"><span>🧙‍♂️</span> {t.npcManageTitle}</h1>
                            
                            <div className="flex flex-wrap justify-end gap-2 w-full md:w-auto items-center">
                                <input 
                                    type="text" 
                                    placeholder={t.searchPlaceholder} 
                                    className="game-input text-sm !py-2 w-full md:w-48" 
                                    value={searchTerm}
                                    onChange={(e) => { setSearchTerm(e.target.value); setCurrentPage(1); }}
                                />
                                <button onClick={onRefresh} className="game-button bg-gradient-to-b from-gray-100 to-gray-200 !border-gray-300 !text-gray-700 !shadow-[0_4px_0_#D1D5DB] px-4 py-2 text-sm active:!shadow-[0_0px_0_#D1D5DB] flex items-center gap-2">🔄 {t.refresh}</button>
                                
                                <input type="file" accept=".csv" ref={fileInputRef} onChange={handleImport} className="hidden" />
                                <button onClick={handleImportClick} className="game-button bg-gradient-to-b from-purple-400 to-purple-600 !border-purple-300 !shadow-[0_4px_0_#6B21A8] px-4 py-2 text-sm active:!shadow-[0_0px_0_#6B21A8] flex items-center gap-2">📥 {t.btnImport}</button>
                                
                                <button onClick={handleExport} className="game-button bg-gradient-to-b from-orange-400 to-orange-500 !border-orange-200 !shadow-[0_4px_0_#C2410C] px-4 py-2 text-sm active:!shadow-[0_0px_0_#C2410C] flex items-center gap-2">📤 {t.btnExport}</button>
                                
                                <button onClick={() => openModal('create')} className="game-button px-4 py-2 text-sm flex items-center gap-2">➕ {t.createNpcBtn}</button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-md border-2 border-gray-200 overflow-hidden">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left min-w-[800px]">
                                    <thead className="bg-panel text-white text-sm whitespace-nowrap">
                                        <tr>
                                            <th className="p-4 text-center">{t.empIdLabel}</th>
                                            <th className="p-4">{t.colNameLastname}</th>
                                            <th className="p-4 text-center">{t.colNickname}</th>
                                            <th className="p-4 text-center">{t.colRole}</th>
                                            <th className="p-4 text-center">{t.colActions}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {currentItems.map(n => (
                                            <tr key={n.id} className="border-b border-gray-100 hover:bg-gray-50 font-medium text-sm">
                                                <td className="p-4 text-gray-500 font-mono text-center font-bold">{n.id}</td>
                                                <td className="p-4 text-dark font-bold flex items-center gap-3">
                                                    <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-xl">🧙‍♂️</div> {n.name}
                                                </td>
                                                <td className="p-4 text-center text-gray-600 font-bold">{n.nickname}</td>
                                                <td className="p-4 text-center"><span className={`px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm border ${n.role==='Admin' ? 'bg-purple-100 text-purple-800 border-purple-200' : 'bg-blue-100 text-blue-800 border-blue-200'}`}>{n.role}</span></td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap justify-center gap-2">
                                                        <button onClick={() => openModal('view', n)} className="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg shadow-sm text-xs font-bold transition flex items-center gap-1" title={t.btnView}>👁️ {t.btnView}</button>
                                                        <button onClick={() => openModal('edit', n)} className="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1.5 rounded-lg shadow-sm text-xs font-bold transition flex items-center gap-1" title={t.btnEdit}>✏️ {t.btnEdit}</button>
                                                        <button onClick={() => handleDelete(n.id)} className="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg shadow-sm text-xs font-bold transition flex items-center gap-1" title={t.btnDelete}>🗑️ {t.btnDelete}</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                        {currentItems.length === 0 && (
                                            <tr><td colSpan="5" className="p-8 text-center text-gray-400 font-bold">{t.noNpcFound}</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            
                            {totalPages > 1 && (
                                <div className="p-4 bg-gray-50 border-t border-gray-200 flex justify-between items-center">
                                    <span className="text-sm font-bold text-gray-500">{t.page} {currentPage} {t.from} {totalPages} ({filteredNPCs.length} {t.items})</span>
                                    <div className="flex gap-2">
                                        <button onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))} disabled={currentPage === 1} className="px-4 py-2 rounded-lg font-bold text-sm bg-white border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">{t.prevPage}</button>
                                        <button onClick={() => setCurrentPage(prev => Math.min(prev + 1, totalPages))} disabled={currentPage === totalPages} className="px-4 py-2 rounded-lg font-bold text-sm bg-white border border-gray-300 hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed">{t.nextPage}</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {modalState.isOpen && (
                        <ModalPortal>
                            <div className="fixed inset-0 z-[9999] overflow-y-auto bg-gray-900/60 backdrop-blur-sm">
                                <div className="flex min-h-screen items-center justify-center p-4 text-center sm:p-6">
                                    <div className="relative w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 animate-pop-in border-4 border-gold shadow-2xl text-left transition-all my-8 mx-auto">
                                        <h2 className="text-2xl font-black text-panel mb-6 border-b-2 border-gray-100 pb-4 flex items-center gap-2">
                                            <span>{modalState.mode === 'create' ? '➕' : modalState.mode === 'edit' ? '✏️' : '👁️'}</span>
                                            {modalState.mode === 'create' ? t.modalCreateNpc : modalState.mode === 'edit' ? t.modalEditNpc : t.modalViewNpc}
                                        </h2>
                                        <form onSubmit={handleSubmit} className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="font-bold text-gray-700 block mb-1 text-sm">{t.usernameLabel}</label>
                                                    <input type="text" required className="game-input text-sm" placeholder="Ex. user01" 
                                                        value={formData.username} onChange={e => setFormData({...formData, username: e.target.value})} disabled={isReadOnly} />
                                                </div>
                                                <div>
                                                    <label className="font-bold text-gray-700 block mb-1 text-sm">{t.passwordLabel}</label>
                                                    <input type={isReadOnly ? "text" : "password"} required className="game-input text-sm" placeholder="***" 
                                                        value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} disabled={isReadOnly} />
                                                </div>
                                            </div>
                                            
                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1 text-sm">{t.empIdLabel}</label>
                                                <input type="text" required className="game-input text-sm" placeholder="e.g. E003"
                                                    value={formData.empId} onChange={e => setFormData({...formData, empId: e.target.value})} disabled={isReadOnly || modalState.mode === 'edit'} />
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="font-bold text-gray-700 block mb-1 text-sm">{t.colNameLastname}</label>
                                                    <input type="text" required className="game-input text-sm" placeholder="e.g. Somchai"
                                                        value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} disabled={isReadOnly} />
                                                </div>
                                                <div>
                                                    <label className="font-bold text-gray-700 block mb-1 text-sm">{t.colNickname}</label>
                                                    <input type="text" required className="game-input text-sm" placeholder="e.g. Chai"
                                                        value={formData.nickname} onChange={e => setFormData({...formData, nickname: e.target.value})} disabled={isReadOnly} />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="font-bold text-gray-700 block mb-1 text-sm">{t.colRole}</label>
                                                <select className="game-input text-sm" value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} disabled={isReadOnly}>
                                                    <option value="Staff">{t.roleStaff}</option>
                                                    <option value="Admin">{t.roleAdmin}</option>
                                                </select>
                                            </div>

                                            <div className="flex gap-4 mt-8 pt-4">
                                                {isReadOnly ? (
                                                    <button type="button" onClick={closeModal} className="w-full py-4 game-button game-button-blue text-lg">{t.btnCloseWindow}</button>
                                                ) : (
                                                    <>
                                                        <button type="button" onClick={closeModal} className="flex-1 py-4 game-button game-button-red text-lg shadow-[0_6px_0_#991B1B]">{t.btnCancel}</button>
                                                        <button type="submit" className="flex-1 py-4 game-button game-button-blue text-lg shadow-[0_6px_0_#03045E]">💾 {t.btnSave}</button>
                                                    </>
                                                )}
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}
                </>
            );
        }

        const AdminSettings = ({ systemLogo, setSystemLogo, systemAvatars, setSystemAvatars, t }) => {
            
            const handleSaveSettings = async () => {
                Swal.fire({ title: t.loading, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                
                const payload = {
                    logoUrl: systemLogo,
                    avatars: systemAvatars
                };
                
                const res = await apiCall('saveSettings', payload);
                
                if (res.success) {
                    GameAlert.success(t.alertSuccess, t.btnSaveSettings + " เรียบร้อย", t.btnConfirm);
                } else {
                    GameAlert.error(t.alertError, res.message || "เกิดข้อผิดพลาดในการบันทึก", t.btnConfirm);
                }
            };

            return (
                <div className="space-y-6 animate-pop-in max-w-3xl mx-auto">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border-2 border-gray-200">
                        <h1 className="text-3xl font-black text-panel flex items-center gap-3"><span>⚙️</span> {t.settingsTitle}</h1>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-md border-2 border-gray-200 space-y-6">
                        <div className="grid grid-cols-1 gap-6">
                            <div>
                                <label className="font-bold text-panel block mb-2">{t.logoUrlLabel}</label>
                                <input 
                                    type="text" 
                                    placeholder={t.logoUrlPlaceholder} 
                                    className="game-input text-lg" 
                                    value={systemLogo || ''}
                                    onChange={(e) => setSystemLogo && setSystemLogo(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="border-t-2 border-gray-100 pt-6 mt-2">
                            <h3 className="font-black text-xl text-panel mb-4">{t.avatarUrlLabel}</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {[1, 2, 3, 4, 5].map(lvl => (
                                    <div key={lvl}>
                                        <label className="font-bold text-gray-600 block mb-1 text-sm">Level {lvl}</label>
                                        <input 
                                            type="text" 
                                            placeholder={t.avatarUrlPlaceholder} 
                                            className="game-input text-sm" 
                                            value={systemAvatars ? systemAvatars[lvl] : ''}
                                            onChange={(e) => {
                                                if(setSystemAvatars) {
                                                    setSystemAvatars({...systemAvatars, [lvl]: e.target.value});
                                                }
                                            }}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="border-t-2 border-gray-100 pt-6 mt-2">
                            <label className="font-bold text-panel block mb-2">{t.sysNameLabel}</label>
                            <input type="text" defaultValue="SHE Leadership Journey" className="game-input text-lg" />
                        </div>
                        <div className="grid grid-cols-2 gap-6">
                            <div>
                                <label className="font-bold text-panel block mb-2">{t.primaryColorLabel}</label>
                                <div className="flex items-center gap-2">
                                    <input type="color" defaultValue="#FF8FAB" className="w-12 h-12 rounded cursor-pointer border-2 border-gray-300" />
                                    <span className="font-mono text-gray-500">#FF8FAB</span>
                                </div>
                            </div>
                            <div>
                                <label className="font-bold text-panel block mb-2">{t.defaultLangLabel}</label>
                                <select className="game-input"><option>Thai (TH)</option><option>English (EN)</option></select>
                            </div>
                        </div>
                        
                        <div className="border-t-2 border-gray-100 pt-6 mt-6 space-y-4">
                            <h3 className="font-black text-xl text-panel mb-4">{t.gameFeaturesLabel}</h3>
                            
                            <div className="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                                <div><p className="font-bold text-dark">{t.featureLeaderboard}</p><p className="text-xs text-gray-500">{t.featureLeaderboardDesc}</p></div>
                                <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                    <input type="checkbox" name="toggle" id="toggle1" defaultChecked className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10"/>
                                    <label htmlFor="toggle1" className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                </div>
                            </div>

                            <div className="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                                <div><p className="font-bold text-dark">{t.featureSound}</p><p className="text-xs text-gray-500">{t.featureSoundDesc}</p></div>
                                <div className="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                    <input type="checkbox" name="toggle" id="toggle2" defaultChecked className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer z-10"/>
                                    <label htmlFor="toggle2" className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                </div>
                            </div>
                        </div>

                        <button className="w-full py-4 game-button mt-8 text-xl" onClick={handleSaveSettings}>💾 {t.btnSaveSettings}</button>
                    </div>
                </div>
            );
        }

        const AdminScreen = (props) => {
            const t = props.t;
            const menu = [
                { id: 'dashboard', icon: '🏰', label: t.menuDashboard },
                { id: 'missions', icon: '📜', label: t.menuMissions },
                { id: 'levels', icon: '🌟', label: t.menuLevels },
                { id: 'npc', icon: '🧙‍♂️', label: t.menuNPCs },
                { id: 'settings', icon: '⚙️', label: t.menuSettings },
            ];

            return (
                <div className="flex h-screen bg-gray-100 overflow-hidden font-sans">
                    <div className="w-72 bg-panel text-white flex flex-col hidden md:flex border-r-4 border-[#1a1b26] shadow-xl z-20">
                        <div className="p-6 bg-[#1a1b26] border-b-2 border-gray-700 text-center relative">
                            <div className="text-6xl mb-2 drop-shadow-md">👑</div>
                            <h2 className="font-black text-xl text-gold tracking-wider">{t.adminGuildMaster}</h2>
                        </div>
                        <div className="flex-1 overflow-y-auto py-6 px-4 space-y-2">
                            {menu.map(item => (
                                <button key={item.id} onClick={() => props.setAdminPage(item.id)}
                                    className={`w-full text-left px-5 py-4 rounded-xl flex items-center gap-4 font-bold transition-all ${props.adminPage === item.id ? 'bg-primary text-white shadow-[0_4px_0_#C9184A] transform -translate-y-1' : 'hover:bg-white/10 text-gray-300'}`}>
                                    <span className="text-xl">{item.icon}</span> {item.label}
                                </button>
                            ))}
                        </div>
                        <div className="p-6 bg-[#1a1b26] border-t-2 border-gray-700 space-y-4">
                            <button onClick={() => props.setLang(props.lang === 'th' ? 'en' : 'th')} className="w-full py-2 bg-gray-800 rounded-lg text-gray-300 font-bold hover:bg-gray-700">
                                🌐 {props.lang === 'th' ? 'Switch to English' : 'เปลี่ยนเป็นภาษาไทย'}
                            </button>
                            <button onClick={() => { props.setUser(null); props.setView('login'); }} className="w-full py-3 game-button game-button-red">🚪 {t.logout}</button>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-full overflow-hidden bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')]">
                        <div className="md:hidden bg-panel text-white p-4 flex justify-between items-center border-b-4 border-[#1a1b26]">
                            <h2 className="font-black text-gold">👑 {t.adminGuildAdmin}</h2>
                            <div className="flex gap-2">
                                <button onClick={() => props.setLang(props.lang === 'th' ? 'en' : 'th')} className="bg-gray-800 text-xs px-2 rounded font-bold">
                                    {props.lang === 'th' ? 'EN' : 'TH'}
                                </button>
                                <select className="bg-[#1a1b26] text-white p-2 rounded-lg font-bold border border-gray-600" value={props.adminPage} onChange={(e) => props.setAdminPage(e.target.value)}>
                                    {menu.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                                </select>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 md:p-8">
                            {props.adminPage === 'dashboard' && <AdminDashboard t={t} systemAvatars={props.systemAvatars} allPlayers={props.allPlayers} onRefresh={props.onRefresh} levels={props.levels} missions={props.missions} missionLogs={props.missionLogs} lang={props.lang} />}
                            {props.adminPage === 'missions' && <AdminMissions {...props} t={t} />}
                            {props.adminPage === 'levels' && <AdminLevels {...props} t={t} />}
                            {props.adminPage === 'npc' && <AdminNPCs {...props} t={t} />}
                            {props.adminPage === 'settings' && <AdminSettings {...props} t={t} />}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('th');
            const t = languageDict[lang];
            const [user, setUser] = useState(null); 
            const [view, setView] = useState('login'); 
            const [adminPage, setAdminPage] = useState('dashboard');
            
            const [isAppLoading, setIsAppLoading] = useState(true);

            const [globalLevels, setGlobalLevels] = useState(initialLevels);
            const [globalMissions, setGlobalMissions] = useState(initialMissions);
            const [globalNPCs, setGlobalNPCs] = useState(initialNPCs);
            const [globalMissionLogs, setGlobalMissionLogs] = useState([]);
            const [allPlayers, setAllPlayers] = useState([]); 
            
            const [systemLogo, setSystemLogo] = useState(''); 
            const [systemAvatars, setSystemAvatars] = useState({1: '', 2: '', 3: '', 4: '', 5: ''}); 
            
            const [showLevelUp, setShowLevelUp] = useState(false);
            const [newLevelData, setNewLevelData] = useState(null);

            const fetchInitialData = async () => {
                const res = await apiCall('getInitialData', {});
                if (res && res.success) {
                    setGlobalLevels(res.levels || []);
                    setGlobalMissions(res.missions || []);
                    setGlobalNPCs(res.npcs || []);
                    setAllPlayers(res.users || []);
                    setGlobalMissionLogs(res.missionLogs || []);
                    
                    if (res.settings) {
                        setSystemLogo(res.settings.logoUrl || '');
                        setSystemAvatars({
                            1: res.settings.avatar_level_1 || '',
                            2: res.settings.avatar_level_2 || '',
                            3: res.settings.avatar_level_3 || '',
                            4: res.settings.avatar_level_4 || '',
                            5: res.settings.avatar_level_5 || ''
                        });
                    }
                } else {
                    console.error("ไม่สามารถดึงข้อมูลตั้งต้นได้", res);
                }
            };

            useEffect(() => {
                fetchInitialData().then(() => setIsAppLoading(false));
            }, []);

            const handleRefreshData = async () => {
                Swal.fire({ title: t.loading, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
                await fetchInitialData();
                Swal.close();
            };

            const triggerLevelUp = (newLevelId) => {
                if (globalLevels.length === 0) return;
                const lvl = globalLevels.find(l => String(l.id) === String(newLevelId)) || globalLevels[globalLevels.length-1];
                setNewLevelData(lvl);
                setShowLevelUp(true);
            };

            const handleLevelUpConfirm = async () => {
                if (!newLevelData) return;
                const nextLevel = newLevelData.id;
                
                setUser(prev => ({ ...prev, level: nextLevel }));
                setShowLevelUp(false);
                
                if (user && user.empId) {
                    await apiCall('updateUserLevel', { empId: user.empId, newLevel: nextLevel });
                }
            };

            if (isAppLoading) {
                return (
                    <div className="min-h-[100dvh] flex flex-col items-center justify-center bg-[#FFF0F3] p-6">
                        <div className="text-8xl animate-bounce mb-4">✨</div>
                        <h2 className="text-2xl font-black text-primary text-center">กำลังเชื่อมต่อกิลด์...</h2>
                        <div className="w-48 h-3 bg-pink-100 rounded-full mt-4 overflow-hidden">
                            <div className="h-full bg-primary animate-pulse w-full"></div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-[100dvh] text-dark relative">
                    {view === 'login' && (
                        <LoginScreen setView={setView} setUser={setUser} systemLogo={systemLogo} t={t} lang={lang} setLang={setLang} />
                    )}
                    
                    {view === 'player' && (
                        <PlayerScreen 
                            user={user} setView={setView} setUser={setUser} 
                            triggerLevelUp={triggerLevelUp} 
                            levels={globalLevels} missions={globalMissions}
                            missionLogs={globalMissionLogs}
                            systemAvatars={systemAvatars}
                            lang={lang} setLang={setLang} t={t}
                        />
                    )}
                    
                    {view === 'admin' && (
                        <AdminScreen 
                            user={user} setView={setView} setUser={setUser} 
                            adminPage={adminPage} setAdminPage={setAdminPage}
                            levels={globalLevels} setLevels={setGlobalLevels}
                            missions={globalMissions} setMissions={setGlobalMissions}
                            missionLogs={globalMissionLogs}
                            npcs={globalNPCs} setNpcs={globalNPCs}
                            allPlayers={allPlayers}
                            onRefresh={handleRefreshData}
                            systemLogo={systemLogo} setSystemLogo={setSystemLogo}
                            systemAvatars={systemAvatars} setSystemAvatars={setSystemAvatars}
                            lang={lang} setLang={setLang} t={t}
                        />
                    )}

                    {/* Global Level Up Popup */}
                    {showLevelUp && newLevelData && (
                        <ModalPortal>
                            <div className="fixed inset-0 z-[9999] overflow-y-auto bg-gray-900/60 backdrop-blur-sm">
                                <div className="flex min-h-screen items-center justify-center p-4 text-center sm:p-6">
                                    <div className="relative w-full max-w-sm bg-white rounded-3xl p-8 text-center animate-celebrate game-panel border-gold border-8 shadow-2xl transition-all my-8 mx-auto">
                                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-20 pointer-events-none"></div>
                                        <h2 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-4 drop-shadow-md">🎉 {t.levelUpAlert} 🎉</h2>
                                        <div className="text-9xl mb-4 animate-float drop-shadow-xl w-32 h-32 mx-auto">
                                            <ImageWithFallback src={newLevelData.badge} fallbackEmoji="🔰" className="w-full h-full object-contain" alt="badge" />
                                        </div>
                                        <h3 className="text-3xl font-black text-panel mb-2">{lang === 'th' ? newLevelData.nameTH : newLevelData.nameEN}</h3>
                                        <p className="text-gray-500 mb-8 font-bold">{t.levelUpDesc}</p>
                                        <button onClick={handleLevelUpConfirm} className="w-full py-4 game-button text-xl">🎁 {t.claimReward}</button>
                                    </div>
                                </div>
                            </div>
                        </ModalPortal>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
